name: Database Migrate

# Applies pending Prisma migrations to the production (Neon) database on every
# push to `main` that changes the schema or migrations. This closes the
# "schema changed but production migration not run" failure class (the admin
# dashboard 500s after the blockedAt feature were exactly that: the code read a
# column the production DB didn't have yet).
#
# Requires the MIGRATION_DATABASE_URL repository secret: your production Neon
# pooled connection string (the same value Vercel uses for production
# DATABASE_URL). See web-app/docs/DEPLOYMENT.md §2.
#
# Triggered only when Prisma files change (plus manual dispatch), so it is not
# a connection on every push.

on:
  push:
    branches: [main]
    paths:
      - "web-app/prisma/**"
      - "web-app/package.json"
      - "web-app/pnpm-lock.yaml"
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    working-directory: web-app

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          # Explicit: `uses:` steps ignore `defaults.run.working-directory`.
          version: 11.20.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-app/pnpm-lock.yaml

      - name: Install dependencies (no scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Apply migrations to production
        env:
          # Scoped to this step only (semgrep gha-workflow-env-secret).
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$DATABASE_URL" ]]; then
            echo "::error::MIGRATION_DATABASE_URL secret is required. Add it in GitHub → Settings → Secrets and variables → Actions. Value: the production Neon pooled connection string (same as Vercel's production DATABASE_URL)."
            exit 1
          fi
          # `migrate deploy` applies pending migrations only — it never resets
          # or rewrites data, and additive migrations are safe to run live.
          pnpm exec prisma migrate deploy
