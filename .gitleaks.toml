title = "Behörden-Bot Gitleaks Configuration"

[allowlist]
description = "Allowlist for test fixtures, mock secrets, CI placeholders, and local development defaults"
paths = [
  '''(^|/)tests/''',
  '''(^|/)__tests__/''',
  '''(^|/)\.github/''',
  '''(^|/)docs/''',
  '''(^|/)pnpm-lock\.yaml$''',
  '''(^|/)package\.json$''',
  '''\.env\.example$''',
  '''\.md$'''
]
regexes = [
  '''(?i)e2e-placeholder-secret-[a-f0-9]+''',
  '''(?i)ci-placeholder-secret-not-used-by-tests''',
  '''(?i)e2e-local-secret-not-for-production''',
  '''(?i)test-(?:groq|hf|gemini|key|token|secret)''',
  '''(?i)mock-(?:key|token|secret)''',
  '''behoerden_password''',
  '''postgresql://behoerden_.*'''
]
